<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copeak Classroom | 課題・成績・診断</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin-workspace.css"></head>
<body class="admin-workspace"><main class="admin-frame">
<header class="admin-header"><div><h1>課題・成績・診断</h1><small>Copeak Classroom · 管理者専用 / 読み取り専用</small></div><div class="admin-tools"><span id="activityAdminName"></span><button id="activityRefresh" class="btn btn-light">更新</button><button id="activitySignOut" class="btn btn-light">ログアウト</button></div></header>
<nav class="admin-nav" aria-label="管理画面"><a href="admin.html" >先生の登録・承認</a><a href="admin-activity.html" aria-current="page">課題・成績・診断</a><a href="teacher.html">Classroomへ戻る</a></nav>
<div id="activityStats" class="admin-summary"></div>
<section class="admin-panel" aria-label="利用状況"><div><div class="admin-heading"><h2 id="activityTitle">先生を選択</h2><div class="admin-tools"><button id="activityBack" class="btn btn-light hidden">← 戻る</button><button id="activityErrors" class="btn btn-light">エラー報告</button><button id="activityPreviewButton" class="btn btn-light hidden">教材を見る</button></div></div><p id="activityContext" class="admin-muted">先生から課題・生徒・提出履歴へ進めます。</p><div id="activityMessage" class="alert hidden" role="status"></div></div>
<div class="admin-tools"><input id="activitySearch" placeholder="先生・学校名を検索" aria-label="一覧を検索"><select id="activityFilter" aria-label="先生を絞り込み"><option value="all">すべての先生</option><option value="lessons">課題あり</option><option value="submissions">提出あり</option></select></div>
<div class="admin-table-wrap" id="activityTable" tabindex="0" aria-label="一覧（横スクロール可）"></div>
<div><div class="admin-pager"><span id="activityPage" class="admin-muted" aria-live="polite"></span><div class="buttons"><button id="activityPrevious" class="btn btn-light">前へ</button><button id="activityNext" class="btn btn-light">次へ</button></div></div><p class="admin-notice">成績は保存済みの値です。エラーは端末からの報告（直近30日）で、未提出＝エラーではありません。Copeak本体の未送信待ちは、この画面ではまだ取得しません。</p></div>
</section></main><dialog id="activityPreview"><div class="admin-heading"><h2 id="previewTitle">教材</h2><button id="previewClose" class="btn btn-light">閉じる</button></div><pre id="previewText"></pre></dialog>
<script src="js/config.js"></script><script type="module" src="js/admin-activity.js"></script></body></html>
