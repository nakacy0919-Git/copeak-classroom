<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>Copeak Classroom</title>

  <link
    rel="stylesheet"
    href="styles.css">
</head>

<body>

<main class="auth-wrap">

  <section class="auth-card paper">

    <!-- LEFT -->
    <div class="auth-intro">

      <div class="brand">

        <div class="brand-mark">
          C
        </div>

        <div>
          <div class="brand-title">
            Copeak Classroom
          </div>

          <div class="brand-sub">
            Reading Assignment Platform
          </div>
        </div>

      </div>

      <div style="margin-top:54px">

        <div class="eyebrow">
          Read • Practice • Grow
        </div>

        <h1 style="margin-top:8px">
          Weekly reading,<br>
          made visible.
        </h1>

        <p>
          課題・締切・提出状況・音読スコアを、
          シンプルにひとつの画面で。
        </p>

      </div>

    </div>


    <!-- RIGHT -->
    <div
  id="authFormPanel"
  class="auth-form"
  style="visibility:hidden">

      <div class="eyebrow">
        Copeak Classroom
      </div>

      <h2
        id="formTitle"
        style="margin:5px 0 20px">
        Student Login
      </h2>

      <!-- ==================================
     REMEMBERED STUDENT
=================================== -->

<div
  id="rememberedStudentPanel"
  class="remembered-student hidden">

  <div class="remembered-student-label">
    WELCOME BACK
  </div>

  <div class="remembered-student-name">
    <span id="rememberedStudentName">
      Student
    </span>
  </div>

  <div class="remembered-student-role">
    Student Account
  </div>

  <button
    type="button"
    id="rememberedStudentContinue"
    class="btn btn-primary remembered-student-primary">

    Continue to Classroom →
  </button>

  <button
    type="button"
    id="rememberedStudentSwitch"
    class="btn btn-light remembered-student-secondary">

    Use another student account
  </button>

</div>

      <div
        id="message"
        class="alert hidden">
      </div>


      <!-- ROLE -->
      <div
        class="segmented"
        style="margin-bottom:22px">

        <button
          type="button"
          id="roleStudent"
          class="active">
          Student
        </button>

        <button
          type="button"
          id="roleTeacher">
          Teacher
        </button>

      </div>


      <!-- ==================================
           STUDENT LOGIN
      =================================== -->

      <form
        id="studentForm"
        class="form-stack">


        <div class="field">

          <label>
            Class Code
          </label>

          <input
            id="studentClassCode"
            class="input"
            autocomplete="off"
            autocapitalize="characters"
            style="
              text-transform:uppercase;
              letter-spacing:.12em
            "
            placeholder="例：108D75"
            required>

        </div>


        <div class="field">

          <label>
            Student No.
          </label>

          <input
            id="studentNumber"
            class="input"
            autocomplete="off"
            inputmode="numeric"
            placeholder="例：12"
            required>

        </div>


        <div class="field">

          <label>
            Join PIN
          </label>

          <input
            id="studentPin"
            class="input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            pattern="[0-9]*"
            maxlength="6"
            placeholder="6-digit PIN"
            required>

        </div>
                <label
          style="
            display:flex;
            align-items:flex-start;
            gap:10px;
            cursor:pointer;
            font-size:14px;
            line-height:1.45;
          ">

          <input
            id="studentRememberLogin"
            type="checkbox"
            checked
            style="
              width:18px;
              height:18px;
              margin-top:2px;
              flex:none;
            ">

          <span>
            この端末でログイン状態を保持する

            <span
              class="tiny muted"
              style="
                display:block;
                margin-top:3px;
              ">
              自分専用のiPad・PCで使用してください。共有端末ではチェックを外してください。
            </span>
          </span>

        </label>

        <button
          id="studentEnterBtn"
          class="btn btn-primary"
          style="padding:13px">

          Enter Classroom

        </button>


        <div
          class="tiny muted"
          style="
            text-align:center;
            margin-top:4px
          ">

          メールアドレス・パスワードは不要です

        </div>

      </form>


      <!-- ==================================
           TEACHER LOGIN
      =================================== -->

      <form
        id="teacherForm"
        class="form-stack hidden">


        <div
          id="teacherNameField"
          class="field hidden">

          <label>
            Name
          </label>

          <input
            id="teacherDisplayName"
            class="input"
            autocomplete="name"
            placeholder="Your name">

        </div>


        <div class="field">

          <label>
            Email
          </label>

          <input
            id="teacherEmail"
            type="email"
            class="input"
            autocomplete="email"
            placeholder="name@example.com">

        </div>


        <div class="field">

          <label>
            Password
          </label>

          <input
            id="teacherPassword"
            type="password"
            class="input"
            autocomplete="current-password"
            minlength="6"
            placeholder="6 characters or more">

        </div>


        <button
          id="teacherSubmitBtn"
          class="btn btn-primary"
          style="padding:13px">

          Sign in

        </button>


        <button
          type="button"
          id="teacherSwitchMode"
          class="btn btn-light">

          初めて使う先生：アカウント作成

        </button>

      </form>


    </div>

  </section>

</main>


<script src="js/config.js"></script>

<script
  type="module"
  src="js/auth.js">
</script>


</body>

</html>
