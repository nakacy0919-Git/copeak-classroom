name: Classroom feedback regression tests

on:
  push:
    branches:
      - main
      - feat/classroom-teacher-feedback-20261106
  pull_request:
    paths:
      - "js/**"
      - "api/**"
      - "tests/**"
      - "package.json"
      - "supabase/migrations/**"
      - ".github/workflows/classroom-feedback-tests.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < js/student.js
          node --input-type=module --check < js/teacher.js
          node --check api/r2-download-url.js
          node --check api/assignment-media-access.js
      - name: Run regression tests
        run: npm test
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Test the display-order migration against isolated Postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/assignment-order-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106140000_class_assignment_display_order.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/assignment-order-verify.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106140000_class_assignment_display_order.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/assignment-order-verify.sql
      - name: Reject reorder by unrelated teachers
        run: |
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SET request.jwt.claim.sub='44444444-4444-4444-8444-444444444444'; SELECT public.reorder_class_assignments('11111111-1111-4111-8111-111111111111', ARRAY['00000000-0000-4000-8000-000000000002'::uuid,'00000000-0000-4000-8000-000000000001'::uuid]);"; then
            echo "SECURITY FAILURE: unrelated teacher changed the class order"
            exit 1
          fi
          echo "Unauthorized reorder correctly rejected."

