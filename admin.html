<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copeak Classroom | 先生の登録・承認</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin-workspace.css"></head>
<body class="admin-workspace"><main class="admin-frame"><header class="admin-header"><div><h1>先生の登録・承認</h1><small>Copeak Classroom · 管理者専用</small></div><div class="admin-tools"><span id="adminUserName"></span><button id="adminRefresh" class="btn btn-light">更新</button><button id="adminSignOut" class="btn btn-light">ログアウト</button></div></header>
<nav class="admin-nav" aria-label="管理画面"><a href="admin.html" aria-current="page">先生の登録・承認</a><a href="admin-activity.html" >課題・成績・診断</a><a href="teacher.html">Classroomへ戻る</a></nav>
<div class="admin-summary"><span>承認待ち<strong id="adminPendingCount">0</strong></span><span>承認済み<strong id="adminApprovedCount">0</strong></span><span>停止中<strong id="adminSuspendedCount">0</strong></span><span>却下<strong id="adminRejectedCount">0</strong></span></div>
<section class="admin-panel"><div class="admin-heading"><h2>登録された先生</h2><div id="adminMessage" class="alert hidden" role="status"></div></div><div class="admin-tools"><input id="adminTeacherSearch" placeholder="氏名・学校・メールで検索" aria-label="先生を検索"><select id="adminStatusFilter" aria-label="承認状態"><option value="all">すべて</option><option value="pending">承認待ち</option><option value="approved">承認済み</option><option value="suspended">停止中</option><option value="rejected">却下</option></select></div><div id="adminTeacherList" class="admin-table-wrap" tabindex="0" aria-label="先生一覧（横スクロール可）"></div><div class="admin-pager"><span id="adminPage" class="admin-muted"></span><div class="buttons"><button id="adminPrevious" class="btn btn-light">前へ</button><button id="adminNext" class="btn btn-light">次へ</button></div></div></section></main>
<dialog id="adminTeacherDetail"><div class="admin-heading"><h2>先生の登録情報</h2><button id="adminDetailClose" class="btn btn-light">閉じる</button></div><div id="adminDetailBody"></div></dialog><script src="js/config.js"></script><script type="module" src="js/admin.js"></script></body></html>
