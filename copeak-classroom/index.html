<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copeak Classroom</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-wrap"><section class="auth-card paper"><div class="auth-intro"><div class="brand"><div class="brand-mark">C</div><div><div class="brand-title">Copeak Classroom</div><div class="brand-sub">Reading Assignment Platform</div></div></div><div style="margin-top:54px"><div class="eyebrow">Read • Practice • Grow</div><h1 style="margin-top:8px">Weekly reading,<br>made visible.</h1><p>課題・締切・提出状況・音読スコアを、Copeakらしいシンプルな画面でひとつに。</p></div></div><div class="auth-form"><div class="eyebrow">Account</div><h2 id="formTitle" style="margin:5px 0 20px">Welcome back</h2><div id="setupNote" class="alert info hidden">Supabase未接続です。まずは下のDemoで完成イメージを確認できます。</div><div id="message" class="alert hidden"></div><form id="authForm" class="form-stack"><div class="segmented"><button type="button" id="roleStudent" class="active">Student</button><button type="button" id="roleTeacher">Teacher</button></div><div id="nameField" class="field hidden"><label>Name</label><input id="displayName" class="input" autocomplete="name" placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" type="email" class="input" autocomplete="email" required placeholder="name@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" class="input" autocomplete="current-password" minlength="6" required placeholder="6 characters or more"></div><button id="submitBtn" class="btn btn-primary" style="padding:13px">Sign in</button><button type="button" id="switchMode" class="btn btn-light">初めて使う方：アカウント作成</button></form><div class="demo-box"><div class="tiny muted" style="margin-bottom:8px">SUPABASEをつなぐ前でも確認できます</div><div class="grid grid-2"><button id="demoStudent" class="btn btn-dark">Student Demo</button><button id="demoTeacher" class="btn btn-light">Teacher Demo</button></div></div></div></section></main><script src="js/config.js"></script><script type="module" src="js/auth.js"></script></body></html>
